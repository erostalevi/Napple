[package]
name = "napple-account"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Napple Account server: email magic link + passkeys, devices, Ed25519 JWT + JWKS, the end-to-end save-key exchange, profiles, cloud-save version metadata with S3 presigned URLs, and plans with Stripe billing. Never involves Nintendo accounts or servers."

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
ciborium = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hmac = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "limit"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7", "v4"] }

[dev-dependencies]
hpke = { version = "0.12", default-features = false, features = ["x25519", "std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "pkcs8"] }

[[bin]]
name = "napple-account"
path = "src/main.rs"
