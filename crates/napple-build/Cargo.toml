[package]
name = "napple-build"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
napple-core = { path = "../napple-core" }
napple-rewrite = { path = "../napple-rewrite" }
napple-mods = { path = "../napple-mods" }
aes = "0.9"
ctr = "0.9"
cipher = "0.4"
xts-mode = "0.5"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
rayon = "1"
