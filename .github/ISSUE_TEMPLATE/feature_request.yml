name: Feature request
description: Suggest an improvement or a missing piece
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Napple is game-agnostic: per-game behaviour belongs in data, not in code branches. Please never attach game files, keys or firmware.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that Napple does not support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Mention the Switch services, NVN calls or tools involved if you know them.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
