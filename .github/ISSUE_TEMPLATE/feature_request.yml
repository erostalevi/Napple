name: Feature request
description: Suggest an improvement or a missing piece
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Napple is game-agnostic: per-game behaviour belongs in data, not in code branches. Please never attach game files, keys or firmware.
        Not sure it is a concrete request yet? Start a Discussion.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that Napple does not support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Mention the Switch services, NVN calls or tools involved if you know them.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I would like to work on this myself (maintainers will point you at the right files).
