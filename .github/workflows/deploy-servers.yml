# Deploys the Napple game servers (napple-online + napple-room behind Caddy) to AWS at pretend.<NAPPLE_DOMAIN>, and keeps the domain's DNS records.
# Does nothing until AWS credentials are configured: the `guard` job looks for the secrets and every other job is skipped with a notice.
# One-time setup (hosted zone, OIDC role napple-deploy or access keys, environment napple-servers, the bootstrap run): docs/guides/deploy-servers.md
#   push to main touching the servers or infra/ -> plan + apply, build + push images, roll the instance, smoke-test https://pretend.<domain>/healthz
#   workflow_dispatch mode=bootstrap            -> create/update the state bucket (infra/terraform/bootstrap; locking = S3 lock files)
#   workflow_dispatch mode=plan                 -> plan only (no apply, no images, no roll)
#   workflow_dispatch mode=apply                -> same as a push (image_tag set = roll back to that already-pushed tag, no build)
#   workflow_dispatch mode=destroy              -> remove the servers stack (needs confirm=destroy); keeps the hosted zone and the GitHub Pages records
# Every job that touches AWS runs in the GitHub environment napple-servers (its secrets and variables apply; the OIDC trust policy names it).
# While crates/napple-online or crates/napple-room is not in the commit, a stand-in image (infra/docker/stub.Dockerfile) is deployed in its place;
# the first push that brings the crate builds and rolls the real image.
name: deploy-servers

on:
  push:
    branches: [main]
    paths:
      - "crates/napple-online/**"
      - "crates/napple-room/**"
      - "infra/**"
      - "Cargo.lock"
      - ".github/workflows/deploy-servers.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "bootstrap (one-time state bucket), plan, apply, or destroy (keeps the hosted zone)"
        type: choice
        options: [bootstrap, plan, apply, destroy]
        default: plan
      image_tag:
        description: "apply only: roll to this existing image tag (a commit SHA) instead of building this commit (rollback)"
        type: string
        default: ""
      confirm:
        description: "destroy only: type destroy"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # OIDC token for aws-actions/configure-aws-credentials (unused with access keys)

# Never two deploys at once, and never cancel an apply half-way.
concurrency:
  group: deploy-servers
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.13.2"   # latest published GitHub release of the 1.13 line (setup-opentofu downloads releases)
  TF_IN_AUTOMATION: "1"

jobs:
  guard:
    name: Check AWS credentials
    runs-on: ubuntu-latest
    environment: napple-servers # so environment-scoped secrets and variables are visible here too
    timeout-minutes: 5
    outputs:
      auth: ${{ steps.check.outputs.auth }}
      run: ${{ steps.check.outputs.run }}
      mode: ${{ steps.check.outputs.mode }}
      region: ${{ steps.vars.outputs.region }}
      domain: ${{ steps.vars.outputs.domain }}
      zone_id: ${{ steps.vars.outputs.zone_id }}
      instance_type: ${{ steps.vars.outputs.instance_type }}
      architecture: ${{ steps.vars.outputs.architecture }}
      pages_txt: ${{ steps.vars.outputs.pages_txt }}
      dns_overwrite: ${{ steps.vars.outputs.dns_overwrite }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        name: Resolve the repository / environment variables
        env:
          REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          DOMAIN: ${{ vars.NAPPLE_DOMAIN || 'napple.lat' }}
          ZONE_ID: ${{ vars.NAPPLE_ZONE_ID || '' }}
          INSTANCE_TYPE: ${{ vars.NAPPLE_INSTANCE_TYPE || 't4g.micro' }}
          ARCHITECTURE: ${{ vars.NAPPLE_ARCHITECTURE || 'arm64' }}
          PAGES_TXT: ${{ vars.NAPPLE_PAGES_VERIFICATION_TXT || '' }}
          DNS_OVERWRITE: ${{ vars.NAPPLE_DNS_ALLOW_OVERWRITE || 'true' }}
        run: |
          {
            echo "region=$REGION"; echo "domain=$DOMAIN"; echo "zone_id=$ZONE_ID"; echo "instance_type=$INSTANCE_TYPE"
            echo "architecture=$ARCHITECTURE"; echo "pages_txt=$PAGES_TXT"; echo "dns_overwrite=$DNS_OVERWRITE"
          } >> "$GITHUB_OUTPUT"
      - id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          mode="apply"; [ "$EVENT" = workflow_dispatch ] && mode="$INPUT_MODE"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          skip() { echo "::notice title=deploy-servers skipped::$1"; echo "### deploy-servers skipped" >> "$GITHUB_STEP_SUMMARY"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ -n "$ROLE_ARN" ]; then auth=oidc
          elif [ -n "$KEY_ID" ] && [ -n "$KEY_SECRET" ]; then auth=keys
          else skip "No AWS credentials: add the secret AWS_DEPLOY_ROLE_ARN (OIDC, preferred) or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY. See docs/guides/deploy-servers.md."
          fi
          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          if [ "$mode" != plan ] && [ "$REF" != refs/heads/main ]; then skip "mode=$mode only runs on main (this run is on $REF); use mode=plan elsewhere."; fi
          if [ "$mode" = destroy ] && [ "$CONFIRM" != destroy ]; then skip "mode=destroy needs the input confirm=destroy."; fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "AWS credentials: $auth; mode: $mode" >> "$GITHUB_STEP_SUMMARY"

  bootstrap:
    name: Bootstrap the state bucket
    needs: guard
    if: needs.guard.outputs.run == 'true' && needs.guard.outputs.mode == 'bootstrap'
    runs-on: ubuntu-latest
    environment: napple-servers
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ needs.guard.outputs.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.guard.outputs.auth == 'oidc'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: napple-bootstrap-${{ github.run_id }}
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.guard.outputs.auth == 'keys'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: infra/scripts/bootstrap.sh apply

  infra:
    name: OpenTofu ${{ needs.guard.outputs.mode }} (servers + DNS)
    needs: guard
    if: needs.guard.outputs.run == 'true' && needs.guard.outputs.mode != 'bootstrap'
    runs-on: ubuntu-latest
    environment: napple-servers
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ needs.guard.outputs.region }}
      TF_VAR_domain: ${{ needs.guard.outputs.domain }}
      TF_VAR_zone_id: ${{ needs.guard.outputs.zone_id }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_instance_type: ${{ needs.guard.outputs.instance_type }}
      TF_VAR_architecture: ${{ needs.guard.outputs.architecture }}
      TF_VAR_github_pages_verification_txt: ${{ needs.guard.outputs.pages_txt }}
      TF_VAR_dns_allow_overwrite: ${{ needs.guard.outputs.dns_overwrite }}
    outputs:
      instance_id: ${{ steps.tofu.outputs.instance_id }}
      public_ip: ${{ steps.tofu.outputs.public_ip }}
      server_fqdn: ${{ steps.tofu.outputs.server_fqdn }}
      log_group: ${{ steps.tofu.outputs.log_group }}
      ecr_online: ${{ steps.tofu.outputs.ecr_online }}
      ecr_room: ${{ steps.tofu.outputs.ecr_room }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.guard.outputs.auth == 'oidc'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: napple-infra-${{ github.run_id }}
          mask-aws-account-id: false # the ECR URLs carry it and masked values cannot pass between jobs
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.guard.outputs.auth == 'keys'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Offline checks (fmt, validate, mocked plan tests)
        working-directory: infra/terraform
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false && tofu validate
          # the mocked tests assert the stack's defaults: run them without the job's TF_VAR_* values
          # shellcheck disable=SC2046  # word splitting is intended: one "-u NAME" per variable
          env $(env | sed -n 's/^\(TF_VAR_[A-Za-z0-9_]*\)=.*/-u \1/p') tofu test
          rm -rf .terraform
      - id: tofu
        env:
          MODE: ${{ needs.guard.outputs.mode }}
        run: infra/scripts/tofu-servers.sh "$MODE"

  images:
    name: Build + push ${{ matrix.image }}
    needs: [guard, infra]
    if: needs.guard.outputs.mode == 'apply' && !inputs.image_tag
    # Native runner for the instance's architecture: no QEMU, so a release build of a Rust crate takes minutes, not an hour.
    runs-on: ${{ needs.guard.outputs.architecture == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    environment: napple-servers
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ needs.guard.outputs.region }}
    strategy:
      matrix:
        image: [napple-online, napple-room]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.guard.outputs.auth == 'oidc'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: napple-images-${{ github.run_id }}
          mask-aws-account-id: false
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.guard.outputs.auth == 'keys'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false
      - id: exists
        name: Skip when this commit's image is already in ECR (tags are immutable)
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if aws ecr describe-images --repository-name "$IMAGE" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "::notice::$IMAGE:$GITHUB_SHA already pushed"
          else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - id: src
        name: Real server, or the stand-in while the crate is not in this commit
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ -f "crates/$IMAGE/Cargo.toml" ]; then
            { echo "file=infra/docker/$IMAGE.Dockerfile"; echo "context=."; echo "role="; } >> "$GITHUB_OUTPUT"
          else
            { echo "file=infra/docker/stub.Dockerfile"; echo "context=infra/local"; echo "role=${IMAGE#napple-}"; } >> "$GITHUB_OUTPUT"
            echo "::notice title=$IMAGE stand-in::crates/$IMAGE is not in this commit: deploying the stand-in (infra/docker/stub.Dockerfile) as $IMAGE."
            echo "$IMAGE: **stand-in** (crate not in this commit)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.exists.outputs.found == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found == 'false'
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.found == 'false'
        with:
          context: ${{ steps.src.outputs.context }}
          file: ${{ steps.src.outputs.file }}
          build-args: ${{ steps.src.outputs.role && format('ROLE={0}', steps.src.outputs.role) || '' }}
          platforms: linux/${{ needs.guard.outputs.architecture == 'x86_64' && 'amd64' || 'arm64' }}
          push: true
          provenance: false
          tags: ${{ matrix.image == 'napple-online' && needs.infra.outputs.ecr_online || needs.infra.outputs.ecr_room }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  roll:
    name: Roll the instance + smoke test
    needs: [guard, infra, images]
    # images is skipped on a rollback (image_tag set): still roll then.
    if: always() && needs.guard.outputs.mode == 'apply' && needs.infra.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    environment: napple-servers
    timeout-minutes: 45 # SSM registration (<= 10 min) + the roll command (<= 20 min, cloud-init wait included) + smoke test
    env:
      AWS_REGION: ${{ needs.guard.outputs.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.guard.outputs.auth == 'oidc'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: napple-roll-${{ github.run_id }}
          mask-aws-account-id: false
      - uses: aws-actions/configure-aws-credentials@v4
        if: needs.guard.outputs.auth == 'keys'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false
      - name: Roll through SSM
        env:
          TAG: ${{ inputs.image_tag || github.sha }}
          INSTANCE: ${{ needs.infra.outputs.instance_id }}
          ONLINE: ${{ needs.infra.outputs.ecr_online }}
          ROOM: ${{ needs.infra.outputs.ecr_room }}
          PUBLIC_IP: ${{ needs.infra.outputs.public_ip }}
          FQDN: ${{ needs.infra.outputs.server_fqdn }}
          LOG_GROUP: ${{ needs.infra.outputs.log_group }}
        run: infra/scripts/roll.sh "$INSTANCE" "$ONLINE:$TAG" "$ROOM:$TAG" "$PUBLIC_IP" "$FQDN" "$LOG_GROUP"
      - name: Smoke test
        env:
          FQDN: ${{ needs.infra.outputs.server_fqdn }}
        run: infra/scripts/smoke.sh "https://$FQDN"
