# Builds Napple/docs into a static site served under /docs/ of the GitHub Pages site (see .github/workflows/pages.yml).
# Local build: python3 -m venv .venv && .venv/bin/pip install -r docs-site/requirements.txt && .venv/bin/mkdocs build --strict -f docs-site/mkdocs.yml
site_name: Napple documentation
site_description: Documentation of Napple, a Switch to macOS decompiler and runtime.
docs_dir: ../docs
site_dir: ../build/docs-site
use_directory_urls: true
hooks:
  - hooks.py

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
