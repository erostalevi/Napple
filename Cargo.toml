[workspace]
resolver = "2"
members = ["crates/napple-core", "crates/napple-cli", "crates/napple-rewrite", "crates/napple-compat", "crates/napple-sigs", "crates/napple-build", "crates/napple-mods"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[profile.release]
codegen-units = 1
panic = "abort"
strip = "none"
lto = "fat"
