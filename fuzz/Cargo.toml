[package]
name = "napple-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Not part of the default workspace (own [workspace] table): `cargo test --workspace` never builds it.
# Run with `cargo +nightly fuzz run <target>` from this folder; see docs/guides/fuzzing.md.
[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
aes = "0.8"
xts-mode = "0.5"
serde_json = "1"
napple-core = { path = "../crates/napple-core" }
napple-build = { path = "../crates/napple-build" }
napple-mods = { path = "../crates/napple-mods" }
napple-rewrite = { path = "../crates/napple-rewrite" }

[profile.release]
debug = 1

[[bin]]
name = "bktr_nca"
path = "fuzz_targets/bktr_nca.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bktr_tables"
path = "fuzz_targets/bktr_tables.rs"
test = false
doc = false
bench = false

